apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-java
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: 'https://github.com/muzzammil-hamdu/Project-java.git'
    path: helm/project-java
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
